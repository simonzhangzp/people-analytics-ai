[project]
name = "people-data-platform"
version = "0.1.0"
description = "People Analytics lake, ingestion, and mart pipeline"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14.0",
  "numpy>=1.26",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["people_*"]
