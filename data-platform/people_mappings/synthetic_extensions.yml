canonical_version: people_v2
gate: 1
note: 'Every SYNTHETIC_EXTENSION must appear here and later in people_meta_attribute. E8 was proposed then withdrawn: HRMS
  custom field Employee.employment_type exists.'
extensions:
- id: E1
  object: people_ref_comp_band
  reason: Frappe HR has no compensation band object; compa-ratio requires band_mid.
  real_world_source: Compensation system / market survey
- id: E2
  object: people_dim_grade.level_rank
  reason: Employee Grade has no sort order.
  real_world_source: Job architecture document
- id: E3
  object: people_ref_city
  reason: Frappe Branch has only a name.
  real_world_source: Address master
- id: E4
  object: people_dim_recruiter
  reason: Harvest user has identity and permissions only.
  real_world_source: TA operating config
- id: E5
  object: engagement_ext (survey_instrument, survey_wave, survey_response)
  reason: No open-source HRIS in this pin has a survey module.
  real_world_source: Engagement platform
  contract: people_source_contracts/engagement_ext/
- id: E6
  object: people_ref_separation_reason_map
  reason: Employee.reason_for_leaving is free text; simulator uses a controlled vocabulary.
  real_world_source: Separation reason master
- id: E7
  object: GlobalTech org tree names and structure
  reason: Synthetic company overlay on people_dim_org.
  real_world_source: none
- id: E8
  object: people_dim_worker.employment_type
  reason: Withdrawn. HRMS v16.15.0 get_custom_fields() adds Employee.employment_type (Link Employment Type) and Employee.grade
    (Link Employee Grade). Provenance is SOURCE_NATIVE (hrms custom field).
  real_world_source: hrms/setup.py
  status: withdrawn
  gate1_decision: Not approved. Use SOURCE_NATIVE from the HRMS custom-field overlay.
- id: E9
  object: people_evt_worker_change.change_reason=rebalance_synthetic
  reason: Month-end extract-diff manager changes with no same-day transfer or promotion are tree-repair artifacts, not T7 reorg. Classified in silver; excluded from people_evt_manager_change, mobility marts, and Case 3 signals.
  real_world_source: none
  status: approved
  gate: data-v1.1
