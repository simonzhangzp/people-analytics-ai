canonical_version: people_v2
gate: 1
note: Branch has only a name. City/country/region come from people_ref_city (E3).
source_contract:
  frappe: erpnext_doctypes/branch.json
  greenhouse: schemas/fields/office.fields.json
fields:
- canonical_table: people_xw_location
  canonical_field: location_id
  source_system: frappe_hr
  source_object: Branch
  transformation: canonical location key = Branch.name
  nullable: false
  data_type: text
  effective_date_logic: SCD2 from extract diff; valid_to is next change or 9999-12-31 (BR-ORG-002)
  provenance: CANONICAL_KEY
  business_definition: Location spine is HRIS branch.
  source_field: name
- canonical_table: people_xw_location
  canonical_field: frappe_branch
  source_system: frappe_hr
  source_object: Branch
  transformation: identity
  nullable: false
  data_type: text
  effective_date_logic: SCD2 from extract diff; valid_to is next change or 9999-12-31 (BR-ORG-002)
  provenance: SOURCE_NATIVE
  business_definition: Frappe Branch.name.
  source_field: name
- canonical_table: people_xw_location
  canonical_field: gh_office_id
  source_system: greenhouse_v3
  source_object: office
  transformation: explicit map; office.location is free-text and is not the join key
  nullable: true
  data_type: integer
  effective_date_logic: SCD2 from extract diff; valid_to is next change or 9999-12-31 (BR-ORG-002)
  provenance: CANONICAL_KEY
  business_definition: Null until approved.
  source_field: id
- canonical_table: people_xw_location
  canonical_field: city
  source_system: engagement_ext
  source_object: people_ref_city
  transformation: lookup E3 by branch_name
  nullable: true
  data_type: text
  effective_date_logic: SCD2 from extract diff; valid_to is next change or 9999-12-31 (BR-ORG-002)
  provenance: SYNTHETIC_EXTENSION
  business_definition: E3. Frappe Branch has no city field.
  source_field: city
- canonical_table: people_xw_location
  canonical_field: country
  source_system: engagement_ext
  source_object: people_ref_city
  transformation: lookup E3
  nullable: true
  data_type: text
  effective_date_logic: SCD2 from extract diff; valid_to is next change or 9999-12-31 (BR-ORG-002)
  provenance: SYNTHETIC_EXTENSION
  business_definition: E3.
  source_field: country
- canonical_table: people_xw_location
  canonical_field: region
  source_system: engagement_ext
  source_object: people_ref_city
  transformation: lookup E3
  nullable: true
  data_type: text
  effective_date_logic: SCD2 from extract diff; valid_to is next change or 9999-12-31 (BR-ORG-002)
  provenance: SYNTHETIC_EXTENSION
  business_definition: E3.
  source_field: region
