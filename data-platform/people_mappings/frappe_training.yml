canonical_version: people_v2
gate: 1
note: Participation grain is Training Event Employee + Training Result Employee. Hours/grade live on the result child, not
  the event child.
source_contract:
  pin:
  - doctypes/training_event.json
  - doctypes/training_event_employee.json
  - doctypes/training_result.json
  - doctypes/training_result_employee.json
fields:
- canonical_table: people_dim_learning_resource
  canonical_field: resource_id
  source_system: frappe_hr
  source_object: Training Event
  transformation: identity
  nullable: false
  data_type: text
  effective_date_logic: start_time
  provenance: CANONICAL_KEY
  business_definition: Internal resource = Training Event.name.
  source_field: name
  source_filter: docstatus = 1
  reversal: docstatus = 2 emits a reversal event (BR-DQ-001)
