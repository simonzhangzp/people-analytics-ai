canonical_version: people_v2
gate: 1
note: Candidate is not an application. person_id is null until T1. first_source_id is derived from the earliest application.source_id.
source_contract:
  pin: schemas/fields/candidate.fields.json
fields:
- canonical_table: people_dim_candidate
  canonical_field: candidate_id
  source_system: greenhouse_v3
  source_object: candidate
  transformation: canonical key = Harvest candidate.id
  nullable: false
  data_type: bigint
  effective_date_logic: created_at
  provenance: CANONICAL_KEY
  business_definition: Candidate key.
  source_field: id
- canonical_table: people_dim_candidate
  canonical_field: gh_candidate_id
  source_system: greenhouse_v3
  source_object: candidate
  transformation: identity
  nullable: false
  data_type: bigint
  effective_date_logic: created_at
  provenance: SOURCE_NATIVE
  business_definition: Harvest candidate.id.
  source_field: id
- canonical_table: people_dim_candidate
  canonical_field: person_id
  source_system: greenhouse_v3
  source_object: offer
  transformation: filled after T1 via xw_identity; null before hire
  nullable: true
  data_type: uuid
  effective_date_logic: starts_on
  provenance: CANONICAL_KEY
  business_definition: Person after accepted offer.
  source_field: application_id
- canonical_table: people_dim_candidate
  canonical_field: created_at
  source_system: greenhouse_v3
  source_object: candidate
  transformation: identity
  nullable: false
  data_type: timestamptz
  effective_date_logic: created_at
  provenance: SOURCE_NATIVE
  business_definition: Candidate created_at.
  source_field: created_at
- canonical_table: people_dim_candidate
  canonical_field: first_source_id
  source_system: greenhouse_v3
  source_object: application
  transformation: source_id of the earliest application for this candidate
  nullable: true
  data_type: bigint
  effective_date_logic: created_at
  provenance: DERIVED
  business_definition: First attributed source. Candidate has no source_id.
  source_field: source_id
