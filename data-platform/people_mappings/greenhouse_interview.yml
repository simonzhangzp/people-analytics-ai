canonical_version: people_v2
gate: 1
note: Scheduled interviews are Harvest interview, not job_interview. Interviewers are not on the interview schema; use scorecard.interviewer_id
  (BR-TA-009).
source_contract:
  pin: schemas/fields/interview.fields.json
fields:
- canonical_table: people_fact_interview
  canonical_field: interview_id
  source_system: greenhouse_v3
  source_object: interview
  transformation: identity
  nullable: false
  data_type: bigint
  effective_date_logic: starts_at
  provenance: CANONICAL_KEY
  business_definition: Harvest interview.id.
  source_field: id
- canonical_table: people_fact_interview
  canonical_field: application_id
  source_system: greenhouse_v3
  source_object: interview
  transformation: identity
  nullable: false
  data_type: bigint
  effective_date_logic: starts_at
  provenance: SOURCE_NATIVE
  business_definition: Application.
  source_field: application_id
- canonical_table: people_fact_interview
  canonical_field: stage_id
  source_system: greenhouse_v3
  source_object: job_interview
  transformation: interview.job_interview_id → job_interview.job_interview_stage_id
  nullable: true
  data_type: bigint
  effective_date_logic: starts_at
  provenance: DERIVED
  business_definition: Stage via job_interview slot.
  source_field: job_interview_stage_id
- canonical_table: people_fact_interview
  canonical_field: start_at
  source_system: greenhouse_v3
  source_object: interview
  transformation: coalesce(starts_at, all_day_start_on)
  nullable: true
  data_type: timestamptz
  effective_date_logic: starts_at
  provenance: SOURCE_NATIVE
  business_definition: Harvest field is starts_at.
  source_field: starts_at
- canonical_table: people_fact_interview
  canonical_field: end_at
  source_system: greenhouse_v3
  source_object: interview
  transformation: coalesce(ends_at, all_day_end_on)
  nullable: true
  data_type: timestamptz
  effective_date_logic: ends_at
  provenance: SOURCE_NATIVE
  business_definition: Harvest field is ends_at.
  source_field: ends_at
- canonical_table: people_fact_interview
  canonical_field: status
  source_system: greenhouse_v3
  source_object: interview
  transformation: identity
  nullable: false
  data_type: text
  effective_date_logic: updated_at
  provenance: SOURCE_NATIVE
  business_definition: Interview lifecycle status.
  source_field: status
- canonical_table: people_fact_interview
  canonical_field: interviewer_person_ids
  source_system: greenhouse_v3
  source_object: scorecard
  transformation: array_agg distinct interviewer_id → person_id for this application/kit (BR-TA-009)
  nullable: true
  data_type: uuid[]
  effective_date_logic: submitted_at
  provenance: DERIVED
  business_definition: Interview schema has no interviewers[].
  source_field: interviewer_id
