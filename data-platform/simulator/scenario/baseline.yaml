  calibration: >
    Applications per opening: Greenhouse Recruiting Benchmarks Report 2023 and Ashby
    2024 Compensations & Benchmarks (tech inbound often 50–200; engineering above
    sales; exec/sourced-heavy roles far lower). Source mix: Jobvite 2023 Recruiting
    Benchmark (inbound majority, referral high-intent, sourced agency/outbound).
    Review→Screen conversion: Jobvite/LinkedIn Talent Solutions — inbound ~10%,
    referral ~4× inbound, sourced pre-qualified ~50–60%. Inbound 60–80% rejected in
    Application Review within days after lognormal stage dwell (quick-reject median 2 days).
    Cancelled openings ~10% of reqs: SHRM Talent Acquisition Benchmarking (cancelled
    / frozen reqs). Time-to-fill later compared to SHRM median ~40–45 days (tech longer).
